<link rel="stylesheet" href="assets/css/style.css">
<style>
  .err-wrap { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 100px 22px 60px; }
  .err-code {
    font-family: var(--font-num);
    font-size: clamp(88px, 18vw, 168px);
    font-weight: 700;
    line-height: 1;
    background: var(--grad-main);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .err-title { font-size: clamp(22px, 4vw, 32px); margin-bottom: 14px; }
  .err-text { color: var(--text-mid); font-size: 16px; max-width: 46ch; margin: 0 auto 30px; }
  .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 34px; }
  .err-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .err-links a {
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13.5px;
    color: var(--text-mid);
    transition: border-color .25s, color .25s, transform .25s var(--ease);
  }
  .err-links a:hover { border-color: rgba(34,211,238,.55); color: var(--text); transform: translateY(-2px); }
</style>
