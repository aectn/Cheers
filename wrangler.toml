# =============================================================================
# 奇思科创社官网 — Cloudflare Worker 静态资源托管配置
# =============================================================================
# 部署：
#   首次使用先登录  → npx wrangler login
#   本地预览        → npx wrangler dev
#   正式上线        → npx wrangler deploy
#
# ⚠️ 本文件刻意【不写 main】（即没有 Worker 脚本入口）。
#    这样请求命中 assets 目录里的文件时由 Assets 层直接返回，
#    不执行任何 Worker 代码 → 不消耗 Worker 请求配额、不限流量。
# =============================================================================

# name 必须与控制台里的 Worker 项目名完全一致，且只能用小写字母、数字和连字符。
# 写成大写（如 Cheers）会导致 Workers Builds 部署失败。
name = "cheers"
compatibility_date = "2026-09-25"

# 静态资源目录：这个文件夹里的内容会被上传到 Cloudflare
# Mizuki(Astro) 构建产物输出到 ./dist
[assets]
directory = "./dist"

# 未匹配到文件时，返回同目录下最近的 404.html
not_found_handling = "404-page"

# 预览部署（Pull Request 场景）需要这个块，内容可以为空。
# 缺失会导致 `npx wrangler preview` 报错：missing a `previews` block
[previews]

# Version URLs（原 Preview URLs）：每次 `wrangler deploy` 生成一个独立版本测试链接，
# 部署到生产前可单独验收某个版本。字段名仍是历史遗留的 preview_urls。
# workers_dev 开启时默认即为启用，这里显式写明，避免重新部署被覆盖。
preview_urls = true

# Workers Observability（可观测性 / Workers Logs）
# 控制台已开启，这里写进配置让设置能被 Git 管理、重新部署不被覆盖。
# 免费额度：每天 20 万条日志、保留 7 天。
# ⚠️ 开启它【不会】触发 Worker 代码、【不】消耗「10 万请求/天」配额——
#    日志是运行时旁路采集。本站点命中 assets 直出、不跑代码，因此几乎不产生日志。
[observability]
enabled = true

# 🚫 红线：不要加 run_worker_first = true
#    一旦开启，所有请求都会先执行一遍 Worker 代码，
#    「静态资源免费无限」的优势立刻归零（详见 README.md 第 3、4 节）。

# 🚫 红线：HTTPS 跳转也不要在这里用 Worker 实现。
#    跳转改用 _headers 里的 HSTS（见同目录 _headers 文件）。

# -----------------------------------------------------------------------------
# 上线后还需在 Cloudflare 控制台做两件事（命令行做不到，详见 README 第 5 节）：
#   1. DNS：给 cheers 加 CNAME 记录指向【优选域名】，代理状态必须是【灰云】
#   2. Worker 设置里添加路由：cheers.aectn.top/*  （注意用 Routes，不是 Custom Domains）
# -----------------------------------------------------------------------------
